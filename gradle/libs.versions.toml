[versions]
kotlin = "1.9.22"
spring-boot = "3.2.2"
spring-cloud = "2023.0.0"
spring-dependency-management = "1.1.4"
minio = "8.5.7"
tus-java-server = "1.0.0-3.0"
postgresql = "42.7.1"
jjwt = "0.12.3"
loki-logback = "1.5.0"
pdfbox = "2.0.31"

[libraries]
# Spring Boot Starters
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Spring Cloud Gateway
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Storage & Upload
minio = { module = "io.minio:minio", version.ref = "minio" }
tus-java-server = { module = "me.desair.tus:tus-java-server", version.ref = "tus-java-server" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }

# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Testing
spring-security-test = { module = "org.springframework.security:spring-security-test" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version = "1.19.3" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
mockk = { module = "io.mockk:mockk", version = "1.13.8" }

#Monitoring
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
loki-logback-appender = { module = "com.github.loki4j:loki-logback-appender", version.ref = "loki-logback" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
micrometer-tracing-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

[bundles]
kotlin = ["kotlin-reflect", "kotlin-stdlib", "jackson-module-kotlin"]
spring-security = ["spring-boot-starter-security", "spring-boot-starter-oauth2-resource-server"]
testing = ["spring-boot-starter-test", "spring-security-test", "mockk"]
observability = ["spring-boot-starter-actuator", "micrometer-registry-prometheus", "loki-logback-appender", "micrometer-tracing-otel", "opentelemetry-exporter-otlp"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
